<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Raíces</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

.hdr{background:#1e293b;border-bottom:1px solid #334155;padding:13px 18px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr-title{font-size:17px;font-weight:700;color:#fff;white-space:nowrap}
.hdr-actions{display:flex;gap:8px;flex-shrink:0}

.fbar{background:#1e293b;border-bottom:1px solid #334155;padding:9px 14px;display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border-radius:20px;border:1.5px solid #334155;background:transparent;color:#64748b;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.fbtn:hover{border-color:#64748b;color:#cbd5e1}
.fbtn.active{color:#fff;font-weight:600;border-color:currentColor}
.fbtn.active[data-f="dashboard"]{color:#a78bfa;border-color:#a78bfa}
.fbtn.active[data-f="todos"]{color:#94a3b8;border-color:#94a3b8}
.fbtn.active[data-f="agenda"]{color:#34d399;border-color:#34d399}
.fbtn.active[data-f="gantt"]{color:#f59e0b;border-color:#f59e0b}
.fbtn.active[data-f="OCD"]{color:#818cf8}.fbtn.active[data-f="Suralnor"]{color:#fbbf24}
.fbtn.active[data-f="Cafaratti"]{color:#a78bfa}.fbtn.active[data-f="Pagani"]{color:#34d399}
.fbtn.active[data-f="Conexxo"]{color:#60a5fa}.fbtn.active[data-f="Artico"]{color:#22d3ee}
.fbtn.active[data-f="Lactosur"]{color:#fb923c}.fbtn.active[data-f="Alianzas"]{color:#f472b6}
.fbtn.active[data-f="ADIA"]{color:#a3e635}.fbtn.active[data-f="Raíces"]{color:#2dd4bf}
.fbtn.active[data-f="Marca Personal"]{color:#c084fc}.fbtn.active[data-f="General"]{color:#94a3b8}
.fbtn.active[data-f="facturacion"]{color:#fbbf24;border-color:#fbbf24}

/* Facturación */
.fact-kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:500px){.fact-kpi-grid{grid-template-columns:repeat(4,1fr)}}
.fact-kpi{background:#1e293b;border:1px solid #334155;border-radius:11px;padding:14px;text-align:center}
.fact-kpi-num{font-size:22px;font-weight:700;margin-bottom:2px}
.fact-kpi-label{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.fact-table{background:#1e293b;border:1px solid #334155;border-radius:11px;overflow:hidden;margin-bottom:14px}
.fact-th{display:grid;grid-template-columns:1.4fr .5fr .9fr .9fr .9fr .65fr .7fr;padding:8px 12px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #334155}
.fact-tr{display:grid;grid-template-columns:1.4fr .5fr .9fr .9fr .9fr .65fr .7fr;padding:9px 12px;font-size:12px;border-bottom:1px solid #1e293b20;align-items:center}
.fact-tr:last-child{border-bottom:none}.fact-tr:hover{background:#263044}
.fact-tc{text-align:right;color:#64748b}
.fact-name{color:#e2e8f0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fact-pill{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600}
.fact-pill-ok{background:#10b98120;color:#10b981;border:1px solid #10b98140}
.fact-pill-pend{background:#f59e0b20;color:#f59e0b;border:1px solid #f59e0b40}
.fact-pill-inact{background:#33415520;color:#475569;border:1px solid #33415540}
.fact-insight{background:#1e293b;border:1px solid #334155;border-radius:11px;padding:14px;margin-bottom:14px}
.fact-insight-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.fact-insight-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #1e293b;font-size:13px}
.fact-insight-row:last-child{border-bottom:none}
.fact-insight-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.fact-insight-text{color:#94a3b8;line-height:1.4}
.fact-insight-text strong{color:#e2e8f0}
.fbtn-add{color:#475569;border-style:dashed}.fbtn-add:hover{color:#a78bfa;border-color:#a78bfa}
.fbtn-sep{width:1px;background:#334155;margin:0 2px;flex-shrink:0}

.tbar{background:#0f172a;padding:7px 14px;display:flex;gap:7px;border-bottom:1px solid #1e293b}
.tbtn{padding:3px 12px;border-radius:12px;border:1px solid #334155;background:transparent;color:#475569;font-size:12px;cursor:pointer;transition:all .15s}
.tbtn.active{background:#1e293b;color:#cbd5e1;border-color:#475569}

.wrap{padding:14px 16px;max-width:960px;margin:0 auto}

.cs-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;margin-top:4px;padding:0 2px}
.cs-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cs-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#64748b}
.cs-count{font-size:11px;color:#334155;margin-left:2px}

.card{background:#1e293b;border:1px solid #334155;border-left:3px solid transparent;border-radius:11px;padding:12px 14px;margin-bottom:7px;transition:border-color .15s}
.card:hover{border-color:#475569}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-info{flex:1;min-width:0}
.card-nombre{font-size:14px;font-weight:500;color:#e2e8f0;line-height:1.3;margin-bottom:5px}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:9px}
.tag-date{color:#64748b;cursor:pointer}.tag-date:hover{color:#94a3b8}.tag-date.late{color:#f87171}
.tag-resp{background:#1e3a5f30;color:#60a5fa;border:1px solid #1e3a5f}
.tag-prog{background:#451a0330;color:#fb923c;border:1px solid #78350f}
.tag-sub{color:#475569;font-style:italic}
.tag-serie{color:#7c3aed;background:#1e0a4030;border:1px solid #4c1d95;font-size:10px}
.tag-prio{font-weight:700;text-align:center;min-width:22px;border-radius:7px}
.tag-prio-A{background:#7f1d1d40;color:#fca5a5;border:1px solid #7f1d1d}
.tag-prio-B{background:#78350f40;color:#fdba74;border:1px solid #78350f}
.tag-prio-C{background:#14532d40;color:#86efac;border:1px solid #14532d}
.tag-reprog{background:#1e1045;color:#a78bfa;border:1px solid #4c1d95;font-size:10px}

.edit-row{display:flex;gap:5px;align-items:center;margin-top:8px;flex-wrap:wrap}
.edit-row label{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase}
.date-inp{background:#0f172a;border:1px solid #475569;border-radius:6px;padding:4px 8px;color:#e2e8f0;font-size:12px}
.date-inp:focus{outline:none;border-color:#6366f1}
.btn-sm{padding:4px 10px;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500}
.btn-sm.save{background:#4f46e5;color:#fff}.btn-sm.cancel{background:#334155;color:#94a3b8}
.btn-sm.done-btn{background:#10b981;color:#fff}

.notes-row{margin-top:8px}
.notes-inp{width:100%;background:#0f172a;border:1px solid #334155;border-radius:7px;padding:7px 10px;color:#e2e8f0;font-size:13px;resize:vertical;min-height:60px;font-family:inherit}
.notes-inp:focus{outline:none;border-color:#6366f1}
.notes-save{margin-top:5px;padding:4px 12px;background:#4f46e5;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer}

.card-btns{display:flex;gap:5px;flex-shrink:0;margin-top:1px}
.icobtn{width:30px;height:30px;border-radius:50%;border:1.5px solid #334155;background:transparent;color:#475569;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.icobtn:hover{border-color:#64748b;color:#cbd5e1}
.icobtn.done:hover{background:#10b981;border-color:#10b981;color:#fff}
.icobtn.del:hover{background:#ef4444;border-color:#ef4444;color:#fff}
.icobtn.notes-btn:hover{background:#6366f1;border-color:#6366f1;color:#fff}
.icobtn.notes-btn.has-notes{color:#818cf8;border-color:#4f46e5}

.btn-primary{padding:8px 15px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-primary:hover{background:#4338ca}
.btn-secondary{padding:8px 14px;background:transparent;color:#64748b;border:1px solid #334155;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn-secondary:hover{color:#cbd5e1;border-color:#475569}
.btn-secondary:disabled{opacity:.5;cursor:not-allowed}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:16px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.finput,.fselect,.ftextarea{width:100%;padding:9px 11px;background:#0f172a;border:1.5px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;font-family:inherit}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:#6366f1}
.ftextarea{resize:vertical;min-height:60px}
.fselect option{background:#1e293b}
.modal-btns{display:flex;gap:8px;margin-top:18px}
.btn-cancel{padding:9px 15px;background:#334155;color:#64748b;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.btn-save{flex:1;padding:9px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

/* Periódico */
.periodic-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;padding:10px 12px;background:#0f172a;border:1.5px solid #334155;border-radius:8px;margin-bottom:13px;transition:border-color .15s}
.periodic-toggle:hover{border-color:#475569}
.periodic-toggle.active{border-color:#7c3aed;background:#1e0a4030}
.periodic-toggle input[type=checkbox]{width:15px;height:15px;accent-color:#7c3aed;cursor:pointer}
.periodic-toggle span{font-size:13px;color:#94a3b8;font-weight:500}
.periodic-toggle.active span{color:#c4b5fd}
.periodic-section{background:#0d1525;border:1px solid #1e1045;border-radius:10px;padding:14px;margin-bottom:13px}
.periodic-section .fg{margin-bottom:10px}
.periodic-section .fg:last-child{margin-bottom:0}
.rec-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-mini{padding:5px 8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:13px;outline:none;font-family:inherit}
.rec-mini:focus{border-color:#7c3aed}
.rec-mini-num{width:65px}
.radio-opt{display:flex;align-items:center;gap:7px;cursor:pointer;padding:6px 0;font-size:13px;color:#94a3b8}
.radio-opt input{accent-color:#7c3aed;width:14px;height:14px;cursor:pointer}
.rec-end-inline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.end-num{width:55px;padding:4px 8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:13px;outline:none}
.end-date{padding:4px 8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:13px;outline:none}
.occ-preview{font-size:11px;color:#7c3aed;margin-top:6px;font-style:italic}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;padding:11px 18px;border-radius:10px;color:#fff;font-size:13px;font-weight:500;z-index:300;animation:ti .2s ease;pointer-events:none;max-width:calc(100vw - 40px)}
@keyframes ti{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading,.empty{text-align:center;padding:50px 16px;color:#334155;font-size:15px}
.cs-mb{margin-bottom:20px}

/* Dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:500px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi-card{background:#1e293b;border:1px solid #334155;border-radius:11px;padding:14px;text-align:center}
.kpi-num{font-size:26px;font-weight:700;margin-bottom:3px}
.kpi-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.kpi-total{color:#e2e8f0}.kpi-done{color:#10b981}.kpi-late{color:#f87171}.kpi-vig{color:#60a5fa}

/* Alertas */
.alertas-section{margin-bottom:14px}
.alerta-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.alerta-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:5px;font-size:13px}
.alerta-rojo{background:#7f1d1d20;border:1px solid #7f1d1d50}
.alerta-naranja{background:#78350f20;border:1px solid #78350f50}
.alerta-amarillo{background:#71390020;border:1px solid #92400e50}
.alerta-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alerta-name{flex:1;color:#e2e8f0}
.alerta-sub{font-size:11px;color:#64748b;margin-left:auto;white-space:nowrap}

/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
@media(min-width:680px){.chart-grid{grid-template-columns:1fr 1fr}}
.chart-box{background:#1e293b;border:1px solid #334155;border-radius:11px;padding:14px}
.chart-box-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.chart-canvas-wrap{position:relative;height:200px}

/* Tabla clientes */
.client-kpi-table{background:#1e293b;border:1px solid #334155;border-radius:11px;overflow:hidden;margin-bottom:14px}
.ckt-header{display:grid;grid-template-columns:1fr 55px 55px 60px 60px 55px 55px;padding:8px 12px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #334155}
.ckt-row{display:grid;grid-template-columns:1fr 55px 55px 60px 60px 55px 55px;padding:9px 12px;font-size:12px;border-bottom:1px solid #1e293b;align-items:center}
.ckt-row:last-child{border-bottom:none}.ckt-row:hover{background:#263044}
.ckt-c{text-align:center;color:#64748b}
.ckt-late{color:#f87171;text-align:center}
.ckt-vig{color:#60a5fa;text-align:center}
.ckt-done{color:#10b981;text-align:center}
.ckt-reprog{color:#a78bfa;text-align:center}
.health-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-align:center}
.health-green{background:#10b98120;color:#10b981;border:1px solid #10b98140}
.health-yellow{background:#f59e0b20;color:#f59e0b;border:1px solid #f59e0b40}
.health-red{background:#ef444420;color:#f87171;border:1px solid #ef444440}

/* Mini grid 2 col */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.mini-box{background:#1e293b;border:1px solid #334155;border-radius:11px;padding:14px}
.mini-box-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e293b;font-size:13px}
.mini-row:last-child{border-bottom:none}

/* Agenda */
.agenda-day{margin-bottom:16px}
.agenda-day-header{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.07em;padding:4px 2px;margin-bottom:6px;border-bottom:1px solid #1e293b}
.agenda-day-header.today{color:#818cf8}
.agenda-item{background:#1e293b;border:1px solid #334155;border-left:3px solid transparent;border-radius:9px;padding:9px 12px;margin-bottom:5px;transition:border-color .15s}
.agenda-item:hover{border-color:#475569}
.agenda-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.agenda-item-name{font-size:13px;font-weight:500;color:#e2e8f0}
.agenda-item-meta{font-size:11px;color:#64748b;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agenda-edit{margin-top:9px;padding-top:9px;border-top:1px solid #334155}
.agenda-edit-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}

/* Gantt */
.gantt-wrap{background:#1e293b;border:1px solid #334155;border-radius:11px;overflow:auto}
.gantt-scale{display:flex;border-bottom:1px solid #334155;background:#0f172a;position:sticky;top:0;z-index:5}
.gantt-label-col{width:200px;flex-shrink:0;font-size:10px;color:#475569;padding:6px 10px;border-right:1px solid #334155}
.gantt-timeline{flex:1;position:relative;min-height:24px}
.gantt-month{position:absolute;top:0;font-size:10px;color:#334155;padding:6px 4px;border-left:1px solid #1e293b}
.gantt-today-vline{position:absolute;top:0;bottom:0;width:2px;background:#6366f180;z-index:3;pointer-events:none}
.gantt-client-hdr{display:flex;background:#0f172a20;border-top:1px solid #334155;padding:5px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;align-items:center}
.gantt-client-hdr-label{width:200px;flex-shrink:0;border-right:1px solid #1e293b;padding-right:8px}
.gantt-row-wrap{display:flex;border-top:1px solid #1e293b30;min-height:26px;align-items:center}
.gantt-row-wrap:hover{background:#263044}
.gantt-task-label{width:200px;flex-shrink:0;padding:3px 10px;font-size:11px;color:#94a3b8;border-right:1px solid #1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-chart-area{flex:1;position:relative;height:26px}
.gantt-bar{position:absolute;top:4px;height:18px;border-radius:4px;cursor:pointer;transition:opacity .15s}
.gantt-bar:hover{opacity:.7}
.gantt-filter-row{padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #334155;background:#0f172a}
.gantt-filter-row label{font-size:11px;color:#64748b}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">🌱 Agenda Raíces</div>
  <div class="hdr-actions">
    <button class="btn-secondary" id="btn-sync" onclick="syncSheet()">↻ Sync</button>
    <button class="btn-primary" onclick="openNewTask()">+ Nueva</button>
  </div>
</div>

<div class="fbar" id="fbar">
  <button class="fbtn active" data-f="dashboard" onclick="setFilter('dashboard')">📊 Dashboard</button>
  <button class="fbtn" data-f="gantt" onclick="setFilter('gantt')">📅 Gantt</button>
  <button class="fbtn" data-f="facturacion" onclick="setFilter('facturacion')">💰 Facturación</button>
  <button class="fbtn" data-f="agenda" onclick="setFilter('agenda')">🗓 Agenda</button>
  <button class="fbtn" data-f="todos" onclick="setFilter('todos')">Todos</button>
  <div class="fbtn-sep"></div>
  <button class="fbtn" data-f="OCD" onclick="setFilter('OCD')">📊 OCD</button>
  <button class="fbtn" data-f="Suralnor" onclick="setFilter('Suralnor')">🏗️ Suralnor</button>
  <button class="fbtn" data-f="Cafaratti" onclick="setFilter('Cafaratti')">👔 Cafaratti</button>
  <button class="fbtn" data-f="Pagani" onclick="setFilter('Pagani')">🏭 Pagani</button>
  <button class="fbtn" data-f="Conexxo" onclick="setFilter('Conexxo')">🔗 Conexxo</button>
  <button class="fbtn" data-f="Artico" onclick="setFilter('Artico')">❄️ Artico</button>
  <button class="fbtn" data-f="Lactosur" onclick="setFilter('Lactosur')">🥛 Lactosur</button>
  <button class="fbtn" data-f="Alianzas" onclick="setFilter('Alianzas')">🤝 Alianzas</button>
  <button class="fbtn" data-f="ADIA" onclick="setFilter('ADIA')">🏛️ ADIA</button>
  <button class="fbtn" data-f="Raíces" onclick="setFilter('Raíces')">🌱 Raíces</button>
  <button class="fbtn" data-f="Marca Personal" onclick="setFilter('Marca Personal')">⭐ Marca</button>
  <button class="fbtn" data-f="General" onclick="setFilter('General')">📁 General</button>
  <button class="fbtn fbtn-add" id="btn-add-company" onclick="openAddCompany()">+ Empresa</button>
</div>

<script>
// ═══ CONSTANTES ═══
const CLIENT_COLORS = {
  'OCD':'#818cf8','Suralnor':'#fbbf24','Cafaratti':'#a78bfa','Pagani':'#34d399',
  'Conexxo':'#60a5fa','Artico':'#22d3ee','Lactosur':'#fb923c','Alianzas':'#f472b6',
  'ADIA':'#a3e635','Raíces':'#2dd4bf','Marca Personal':'#c084fc','General':'#64748b'
};
const DEFAULT_CLIENTS = ['OCD','Suralnor','Cafaratti','Pagani','Conexxo','Artico','Lactosur','Alianzas','ADIA','Raíces','Marca Personal','General'];
let customClients = [];
try { customClients = JSON.parse(localStorage.getItem('raices_custom_clients')||'[]'); } catch(e){}

function CLIENT_ORDER() { return [...DEFAULT_CLIENTS,...customClients.filter(c=>!DEFAULT_CLIENTS.includes(c))]; }

// ═══ ESTADO ═══
let allTasks = [];
let filter = 'dashboard';
let timeFilter = 'todas';
let editingId = null;
let notesOpenId = null;
let deletePending = null;
let agendaEditId = null;
let dashCharts = {};
let ganttClientFilter = 'all';

// ═══ REPROGRAMACIONES (localStorage) ═══
function getReprog() { try{return JSON.parse(localStorage.getItem('raices_reprog')||'{}');}catch(e){return {};} }
function recordReprog(id, originalFin) {
  if (!originalFin) return;
  const data = getReprog();
  if (!data[id]) data[id] = { original: originalFin, count: 0 };
  data[id].count++;
  try { localStorage.setItem('raices_reprog', JSON.stringify(data)); } catch(e){}
}
function getCompanyReprog(tasks) {
  const reprog = getReprog();
  const by = {};
  tasks.forEach(t => { if (reprog[t.id]?.count) by[t.cliente] = (by[t.cliente]||0) + reprog[t.id].count; });
  return by;
}
function getTaskReprogCount(id) { return getReprog()[id]?.count || 0; }

// ═══ MODAL REPROGRAMACIÓN ═══
let reprogPending = null;

function askReprog(id, originalFin, newFin, newInicio, saveType) {
  // Si no cambió la fecha, guardar directo
  if (!newFin || newFin === originalFin || !originalFin) {
    execPendingSave(id, newFin, newInicio, saveType, false);
    return;
  }
  reprogPending = { id, originalFin, newFin, newInicio, saveType };
  document.getElementById('reprog-original-date').textContent = fmtDate(originalFin);
  document.getElementById('reprog-new-date').textContent = fmtDate(newFin);
  document.getElementById('modal-reprog').classList.add('open');
}

function reprogYes() {
  if (!reprogPending) return;
  recordReprog(reprogPending.id, reprogPending.originalFin);
  execPendingSave(reprogPending.id, reprogPending.newFin, reprogPending.newInicio, reprogPending.saveType, true);
  closeReprogModal();
}

function reprogNo() {
  if (!reprogPending) return;
  execPendingSave(reprogPending.id, reprogPending.newFin, reprogPending.newInicio, reprogPending.saveType, false);
  closeReprogModal();
}

function closeReprogModal() {
  document.getElementById('modal-reprog').classList.remove('open');
  reprogPending = null;
}

async function execPendingSave(id, newFin, newInicio, saveType, wasReprog) {
  if (saveType === 'date') {
    await doSaveDate(id, newInicio, newFin);
  } else if (saveType === 'agenda') {
    const nombre = reprogPending?.nombre || allTasks.find(x=>x.id===id)?.nombre;
    const responsable = reprogPending?.responsable;
    await doSaveAgendaEdit(id, nombre, newFin, responsable);
  }
  if (wasReprog) toast('Reprogramación registrada ↺','#7c3aed');
}

// ═══ UTILS ═══
function getSID(sub) { const m=(sub||'').match(/^\[SID:([a-z0-9]{8})\]/);return m?m[1]:null; }
function getNotesText(sub) { return (sub||'').replace(/^\[SID:[a-z0-9]{8}\]\s?/,'').trim(); }
function makeSID() { return (Math.random().toString(36).substr(2,8)+'00000000').substr(0,8); }
function parseDate(iso) { if(!iso)return null;const p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]); }
function fmtDate(iso) { if(!iso)return null;return parseDate(iso).toLocaleDateString('es-AR',{day:'numeric',month:'short'}); }
function fmtDateFull(iso) { if(!iso)return null;return parseDate(iso).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'long'}); }
function toISO(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO() { return toISO(new Date()); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function daysSince(iso) { if(!iso)return 0;const today=new Date();today.setHours(0,0,0,0);return Math.floor((today-parseDate(iso))/86400000); }

// ═══ LOAD ═══
loadTasks();

async function loadTasks() {
  document.getElementById('loading').style.display='block';
  document.getElementById('tasklist').innerHTML='';
  try {
    const r=await fetch('/api/tasks');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    allTasks=d.tasks||[];
    render();
  } catch(e) { document.getElementById('loading').textContent='Error al cargar: '+e.message; }
}

// ═══ FILTROS ═══
function setFilter(f) {
  filter=f; editingId=null; notesOpenId=null; agendaEditId=null;
  document.querySelectorAll('.fbtn[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===f));
  const showTime=!['todos','dashboard','agenda','gantt','facturacion'].includes(f);
  document.getElementById('tbar').style.display=showTime?'flex':'none';
  if(!showTime){timeFilter='todas';document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.t==='todas'));}
  render();
}
function setTime(t) { timeFilter=t;document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render(); }

function filtered() {
  const today=new Date();today.setHours(0,0,0,0);
  const in7=new Date(today);in7.setDate(in7.getDate()+7);
  let list=[...allTasks];
  if(filter==='todos')return list;
  if(!['dashboard','agenda','gantt','facturacion'].includes(filter)){
    list=list.filter(t=>t.cliente===filter);
    if(timeFilter==='vigentes')list=list.filter(t=>{const i=parseDate(t.inicio);return!i||i<=in7;});
  }
  return list;
}

// ═══ RENDER PRINCIPAL ═══
function render() {
  document.getElementById('loading').style.display='none';
  const el=document.getElementById('tasklist');
  if(filter==='dashboard'){renderDashboard(el);return;}
  if(filter==='agenda'){renderAgenda(el);return;}
  if(filter==='gantt'){renderGantt(el);return;}
  if(filter==='facturacion'){renderFact(el);return;}
  const list=filtered();
  if(!list.length){el.innerHTML='<div class="empty">Sin tareas para mostrar 🎉</div>';return;}
  const today=new Date();today.setHours(0,0,0,0);
  if(filter==='todos'){
    const co=CLIENT_ORDER();const byClient={};
    co.forEach(c=>{byClient[c]=[];});
    list.forEach(t=>{if(byClient[t.cliente]!==undefined)byClient[t.cliente].push(t);else{if(!byClient['General'])byClient['General']=[];byClient['General'].push(t);}});
    el.innerHTML=co.filter(c=>byClient[c]?.length).map(c=>'<div class="cs-mb"><div class="cs-header"><div class="cs-dot" style="background:'+(CLIENT_COLORS[c]||'#64748b')+'"></div><span class="cs-name">'+c+'</span><span class="cs-count">'+byClient[c].length+'</span></div>'+byClient[c].map(t=>cardHTML(t,today)).join('')+'</div>').join('');
  } else {
    el.innerHTML=list.map(t=>cardHTML(t,today)).join('');
  }
}

// ═══ CARD ═══
function cardHTML(t, today) {
  const fin=parseDate(t.fin);
  const isLate=fin&&fin<today;
  const isWip=t.estado==='En Progreso';
  const color=CLIENT_COLORS[t.cliente]||'#64748b';
  const bc=isLate?'#f87171':isWip?'#fb923c':color;
  const isEditing=editingId===t.id;
  const notesOpen=notesOpenId===t.id;
  const sid=getSID(t.sub);
  const notes=getNotesText(t.sub);
  const reprogCount=getTaskReprogCount(t.id);
  const prioTag=t.prioridad?`<span class="tag tag-prio tag-prio-${t.prioridad}">${t.prioridad}</span>`:'';
  const reprogTag=reprogCount?`<span class="tag tag-reprog">↺ ${reprogCount}x</span>`:'';

  return `<div class="card" id="card-${t.id}" style="border-left-color:${bc}">
    <div class="card-top">
      <div class="card-info">
        <div class="card-nombre">${esc(t.nombre)}</div>
        <div class="card-meta">
          ${prioTag}
          ${t.fin?`<span class="tag tag-date${isLate?' late':''}" onclick="startEdit('${t.id}')" title="Editar fechas">📅 ${fmtDate(t.fin)}</span>`:`<span class="tag tag-date" onclick="startEdit('${t.id}')" title="Agregar fechas">📅 —</span>`}
          ${t.inicio?`<span class="tag tag-date" onclick="startEdit('${t.id}')" title="Editar fechas">▶ ${fmtDate(t.inicio)}</span>`:''}
          ${t.responsable?`<span class="tag tag-resp">${esc(t.responsable)}</span>`:''}
          ${isWip?'<span class="tag tag-prog">En progreso</span>':''}
          ${reprogTag}
          ${sid?'<span class="tag tag-serie">🔁 Serie</span>':''}
          ${notes?`<span class="tag tag-sub">${esc(notes.substring(0,40))}${notes.length>40?'…':''}</span>`:''}
        </div>
        ${isEditing?`<div class="edit-row">
          <label>Inicio</label><input type="date" class="date-inp" id="di-ini-${t.id}" value="${t.inicio||''}">
          <label>Fin</label><input type="date" class="date-inp" id="di-fin-${t.id}" value="${t.fin||''}">
          <button class="btn-sm save" onclick="saveDate('${t.id}')">Guardar</button>
          <button class="btn-sm cancel" onclick="cancelEdit()">✕</button>
        </div>`:''}
        ${notesOpen?`<div class="notes-row">
          <textarea class="notes-inp" id="notes-${t.id}" placeholder="Notas sobre esta tarea...">${esc(notes)}</textarea>
          <button class="notes-save" onclick="saveNotes('${t.id}')">Guardar nota</button>
        </div>`:''}
      </div>
      <div class="card-btns">
        <button class="icobtn notes-btn${notes?' has-notes':''}" onclick="toggleNotes('${t.id}')" title="Notas">📝</button>
        <button class="icobtn done" onclick="markDone('${t.id}')" title="Realizada">✓</button>
        <button class="icobtn del" onclick="deleteTask('${t.id}')" title="Eliminar">✕</button>
      </div>
    </div>
  </div>`;
}

// ═══ DASHBOARD ═══
function renderDashboard(el) {
  el.innerHTML='<div class="loading">Calculando métricas...</div>';
  fetch('/api/tasks?include_done=true').then(r=>r.json()).then(d=>{
    const all=d.tasks||[];
    const today=new Date();today.setHours(0,0,0,0);
    const active=all.filter(t=>t.estado!=='Realizado'&&t.estado!=='Cancelado');
    const done=all.filter(t=>t.estado==='Realizado');
    const late=active.filter(t=>{const f=parseDate(t.fin);return f&&f<today;});
    const vig=active.filter(t=>{const i=parseDate(t.inicio),f=parseDate(t.fin);return(!i||i<=today)&&(!f||f>=today);});

    // Velocidad últimos 30 días (tareas realizadas recientemente)
    const in30back=new Date(today);in30back.setDate(in30back.getDate()-30);

    // Reprogramaciones
    const reprogData=getReprog();
    const companyReprog=getCompanyReprog(all);

    const co=CLIENT_ORDER();
    const clientStats=co.map(c=>{
      const ct=all.filter(t=>t.cliente===c);if(!ct.length)return null;
      const ca=ct.filter(t=>t.estado!=='Realizado'&&t.estado!=='Cancelado');
      const cd=ct.filter(t=>t.estado==='Realizado');
      const cl=ca.filter(t=>{const f=parseDate(t.fin);return f&&f<today;});
      const cv=ca.filter(t=>{const i=parseDate(t.inicio),f=parseDate(t.fin);return(!i||i<=today)&&(!f||f>=today);});
      const avancePct=ct.length?Math.round(cd.length/ct.length*100):0;
      const reprogC=companyReprog[c]||0;
      const lateRatio=ca.length?cl.length/ca.length:0;
      const reprogRatio=ct.length?reprogC/ct.length:0;
      // Salud: base avance, penalizar vencidas y reprogramaciones
      const healthScore=Math.max(0,Math.min(100,avancePct-lateRatio*60-reprogRatio*40));
      const healthLabel=healthScore>=60?'🟢':healthScore>=30?'🟡':'🔴';
      const healthClass=healthScore>=60?'health-green':healthScore>=30?'health-yellow':'health-red';
      // Aging: promedio días que llevan pendientes (con fecha de inicio)
      const withInicio=ca.filter(t=>t.inicio);
      const avgAging=withInicio.length?Math.round(withInicio.reduce((s,t)=>s+daysSince(t.inicio),0)/withInicio.length):null;
      return {c,ct,ca,cd,cl,cv,avancePct,reprogC,healthScore,healthLabel,healthClass,avgAging};
    }).filter(Boolean);

    // Carga por responsable
    const byResp={};
    active.forEach(t=>{const r=t.responsable||'Sin asignar';if(!byResp[r])byResp[r]={total:0,late:0};byResp[r].total++;if(late.find(x=>x.id===t.id))byResp[r].late++;});

    // ── Alertas ──
    const alertasHtml=buildAlertas(all,today);

    el.innerHTML=`
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-num kpi-total">${all.length}</div><div class="kpi-label">Total histórico</div></div>
        <div class="kpi-card"><div class="kpi-num kpi-vig">${vig.length}</div><div class="kpi-label">Vigentes</div></div>
        <div class="kpi-card"><div class="kpi-num kpi-late">${late.length}</div><div class="kpi-label">Vencidas</div></div>
        <div class="kpi-card"><div class="kpi-num kpi-done">${done.length}</div><div class="kpi-label">Realizadas (${all.length?Math.round(done.length/all.length*100):0}%)</div></div>
      </div>

      ${alertasHtml}

      <div class="chart-grid">
        <div class="chart-box">
          <div class="chart-box-title">Estado por empresa</div>
          <div class="chart-canvas-wrap"><canvas id="chart-status"></canvas></div>
        </div>
        <div class="chart-box">
          <div class="chart-box-title">Avance por empresa (realizadas / total)</div>
          <div class="chart-canvas-wrap"><canvas id="chart-avance"></canvas></div>
        </div>
      </div>

      <div class="mini-grid">
        <div class="mini-box">
          <div class="mini-box-title">Carga por responsable</div>
          ${Object.entries(byResp).map(([r,v])=>`<div class="mini-row"><span>${r}</span><span style="display:flex;gap:12px"><span class="ckt-vig">${v.total} activas</span><span class="ckt-late">${v.late} venc.</span></span></div>`).join('')||'<div style="color:#334155;font-size:13px">Sin datos</div>'}
        </div>
        <div class="mini-box">
          <div class="mini-box-title">Reprogramaciones totales</div>
          ${clientStats.filter(s=>s.reprogC>0).map(s=>`<div class="mini-row"><span style="color:${CLIENT_COLORS[s.c]||'#64748b'}">${s.c}</span><span class="ckt-reprog">${s.reprogC}x</span></div>`).join('')||'<div style="color:#334155;font-size:13px">Sin reprogramaciones registradas</div>'}
        </div>
      </div>

      <div class="client-kpi-table">
        <div class="ckt-header">
          <span>Cliente</span>

function buildAlertas(all, today) {
  const active=all.filter(t=>t.estado!=='Realizado'&&t.estado!=='Cancelado');
  const criticas=active.filter(t=>{const f=parseDate(t.fin);return f&&daysSince(t.fin)>14;});
  const demoradas=active.filter(t=>{const f=parseDate(t.fin);return f&&daysSince(t.fin)>0&&daysSince(t.fin)<=14;});
  const estancadas=active.filter(t=>t.inicio&&daysSince(t.inicio)>45&&t.estado!=='En Progreso');

  if(!criticas.length&&!demoradas.length&&!estancadas.length) return '';

  let html='<div class="alertas-section"><div class="alerta-title">⚡ Alertas</div>';

  criticas.slice(0,5).forEach(t=>{
    html+=`<div class="alerta-item alerta-rojo">
      <div class="alerta-dot" style="background:#f87171"></div>
      <div class="alerta-name"><strong>${esc(t.nombre)}</strong> · <span style="color:${CLIENT_COLORS[t.cliente]||'#64748b'}">${t.cliente}</span></div>
      <div class="alerta-sub" style="color:#f87171">${daysSince(t.fin)}d vencida</div>
    </div>`;
  });

  demoradas.slice(0,4).forEach(t=>{
    html+=`<div class="alerta-item alerta-naranja">
      <div class="alerta-dot" style="background:#fb923c"></div>
      <div class="alerta-name">${esc(t.nombre)} · <span style="color:${CLIENT_COLORS[t.cliente]||'#64748b'}">${t.cliente}</span></div>
      <div class="alerta-sub" style="color:#fb923c">${daysSince(t.fin)}d vencida</div>
    </div>`;
  });

  estancadas.slice(0,3).forEach(t=>{
    html+=`<div class="alerta-item alerta-amarillo">
      <div class="alerta-dot" style="background:#f59e0b"></div>
      <div class="alerta-name">${esc(t.nombre)} · <span style="color:${CLIENT_COLORS[t.cliente]||'#64748b'}">${t.cliente}</span></div>
      <div class="alerta-sub" style="color:#f59e0b">${daysSince(t.inicio)}d sin avanzar</div>
    </div>`;
  });

  html+='</div>';
  return html;
}

// ═══ GANTT ═══
function renderGantt(el) {
  const today=new Date();today.setHours(0,0,0,0);
  const winStart=new Date(today);winStart.setMonth(winStart.getMonth()-1);
  const winEnd=new Date(today);winEnd.setMonth(winEnd.getMonth()+3);
  const totalMs=winEnd-winStart;

  const co=CLIENT_ORDER();
  let tasks=allTasks.filter(t=>t.fin||t.inicio);
  if(ganttClientFilter!=='all') tasks=tasks.filter(t=>t.cliente===ganttClientFilter);

  const byClient={};
  co.forEach(c=>{byClient[c]=[];});
  tasks.forEach(t=>{if(byClient[t.cliente])byClient[t.cliente].push(t);});

  function pct(d){return Math.max(0,Math.min(100,Math.round((d-winStart)/totalMs*100)));}
  const todayPct=pct(today);

  // Month labels
  let months=[];
  let mCur=new Date(winStart.getFullYear(),winStart.getMonth(),1);
  while(mCur<=winEnd){months.push({label:mCur.toLocaleDateString('es-AR',{month:'short',year:'2-digit'}),pct:pct(mCur)});mCur=new Date(mCur.getFullYear(),mCur.getMonth()+1,1);}

  // Filter options
  const filterOpts='<option value="all">Todas las empresas</option>'+co.map(c=>`<option value="${esc(c)}"${ganttClientFilter===c?' selected':''}>${esc(c)}</option>`).join('');

  let html=`<div class="gantt-wrap">
    <div class="gantt-filter-row">
      <label>Empresa:</label>
      <select class="date-inp" onchange="ganttClientFilter=this.value;renderGantt(document.getElementById('tasklist'))" style="width:180px">${filterOpts}</select>
      <span style="font-size:11px;color:#334155;margin-left:auto">Ventana: ${fmtDate(toISO(winStart))} → ${fmtDate(toISO(winEnd))}</span>
    </div>
    <div class="gantt-scale">
      <div class="gantt-label-col">Tarea</div>
      <div class="gantt-timeline">
        ${months.map(m=>`<span class="gantt-month" style="left:${m.pct}%">${m.label}</span>`).join('')}
        <div class="gantt-today-vline" style="left:${todayPct}%;height:100%"></div>
      </div>
    </div>`;

  co.filter(c=>byClient[c]?.length).forEach(c=>{
    const color=CLIENT_COLORS[c]||'#64748b';
    html+=`<div class="gantt-client-hdr" style="border-left:3px solid ${color}">
      <div class="gantt-client-hdr-label" style="color:${color}">${c}</div>
      <div style="flex:1"></div>
    </div>`;
    byClient[c].sort((a,b)=>(a.fin||'9999').localeCompare(b.fin||'9999')).forEach(t=>{
      const tS=t.inicio?parseDate(t.inicio):(t.fin?parseDate(t.fin):null);
      const tE=t.fin?parseDate(t.fin):(tS?tS:null);
      if(!tS||!tE)return;
      const left=pct(tS),right=pct(tE);
      const width=Math.max(0.5,right-left);
      const isLate=tE<today&&t.estado!=='Realizado';
      const isDone=t.estado==='Realizado';
      const barColor=isDone?'#10b981':isLate?'#f87171':color;
      html+=`<div class="gantt-row-wrap">
        <div class="gantt-task-label" title="${esc(t.nombre)}">${esc(t.nombre.length>28?t.nombre.slice(0,28)+'…':t.nombre)}</div>
        <div class="gantt-chart-area">
          <div class="gantt-today-vline" style="left:${todayPct}%"></div>
          <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${barColor}99;border:1.5px solid ${barColor}" title="${esc(t.nombre)}: ${fmtDate(t.inicio)||'?'} → ${fmtDate(t.fin)||'?'}"></div>
        </div>
      </div>`;
    });
  });

  if(!co.some(c=>byClient[c]?.length))html+='<div class="empty">Sin tareas con fechas para mostrar</div>';
  html+='</div>';
  el.innerHTML=html;
}

// ═══ AGENDA ═══
function renderAgenda(el) {
  const today=new Date();today.setHours(0,0,0,0);
  const in30=new Date(today);in30.setDate(in30.getDate()+30);
  const overdue=[],byDay={};
  allTasks.forEach(t=>{
    const fin=parseDate(t.fin);if(!fin)return;
    if(fin<today){overdue.push(t);return;}
    if(fin>in30)return;
    if(!byDay[t.fin])byDay[t.fin]=[];
    byDay[t.fin].push(t);
  });
  let html='';
  if(overdue.length)html+='<div class="agenda-day"><div class="agenda-day-header" style="color:#f87171">Vencidas ('+overdue.length+')</div>'+overdue.map(t=>agendaItemHTML(t,today)).join('')+'</div>';
  Object.keys(byDay).sort().forEach(k=>{
    const isToday=k===todayISO();
    html+='<div class="agenda-day"><div class="agenda-day-header'+(isToday?' today':'')+'">'+fmtDateFull(k)+(isToday?' · HOY':'')+'</div>'+byDay[k].map(t=>agendaItemHTML(t,today)).join('')+'</div>';
  });
  if(!html)html='<div class="empty">Sin tareas con fecha en los próximos 30 días 🎉</div>';
  el.innerHTML=html;
}

  const col=CLIENT_COLORS[t.cliente]||'#64748b';

  const isEditing=agendaEditId===t.id;
  const reprogCount=getTaskReprogCount(t.id);
  const prioColors={A:'#fca5a5',B:'#fdba74',C:'#86efac'};
  const prioHTML=t.prioridad?`<span style="background:${prioColors[t.prioridad]}20;color:${prioColors[t.prioridad]};border:1px solid ${prioColors[t.prioridad]}40;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700">${t.prioridad}</span>`:'';

  const editHTML=isEditing?`<div class="agenda-edit">

      </select>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="btn-sm save" onclick="saveAgendaEdit('${t.id}')">Guardar</button>
      <button class="btn-sm done-btn" onclick="markDone('${t.id}')">✓ Realizado</button>
      <button class="btn-sm" style="background:#dc262660;color:#f87171" onclick="markCancelled('${t.id}')">Cancelar tarea</button>
      <button class="btn-sm cancel" onclick="cancelAgendaEdit()">✕</button>
    </div>
  </div>`:'';

  return `<div class="agenda-item" style="border-left-color:${col}">
    <div class="agenda-item-top">
      <div>
        <div class="agenda-item-name">${esc(t.nombre)}</div>
        <div class="agenda-item-meta">
          <span style="color:${col}">${t.cliente}</span>
          ${t.responsable?`<span>· ${esc(t.responsable)}</span>`:''}
          ${overdueDays>0?`<span style="color:#f87171">⚠ ${overdueDays}d vencida</span>`:''}

      <button class="icobtn" onclick="startAgendaEdit('${t.id}')" title="Editar" style="font-size:11px">✏</button>
    </div>
    ${editHTML}
  </div>`;
}

// ═══ PERIÓDICO ═══
function togglePeriodic(){const cb=document.getElementById('nt-periodic');const on=cb.checked;document.getElementById('periodic-section').style.display=on?'block':'none';document.getElementById('periodic-toggle').classList.toggle('active',on);updatePreview();}
function updatePeriodicUI(){const type=document.querySelector('input[name="rec-type"]:checked')?.value;document.getElementById('rec-interval-opts').style.display=type==='interval'?'block':'none';document.getElementById('rec-monthly-opts').style.display=type==='monthly_day'?'block':'none';updatePreview();}
function updatePreview(){const cb=document.getElementById('nt-periodic');if(!cb?.checked)return;const occs=generateOccurrences(buildRule());const el=document.getElementById('occ-preview');if(!el)return;if(!occs.length){el.textContent='';return;}el.textContent=occs.length+' ocurrencias · '+fmtDate(occs[0].fin||occs[0].inicio)+(occs.length>1?' → '+fmtDate(occs[occs.length-1].fin||occs[occs.length-1].inicio):'');}
function getNthWeekdayOfMonth(year,month,weekday,n){if(n===-1){let d=new Date(year,month+1,0);while(d.getDay()!==weekday)d.setDate(d.getDate()-1);return d;}let d=new Date(year,month,1);while(d.getDay()!==weekday)d.setDate(d.getDate()+1);d.setDate(d.getDate()+(n-1)*7);return d;}
function buildRule(){const recType=document.querySelector('input[name="rec-type"]:checked')?.value||'interval';const recEndType=document.querySelector('input[name="rec-end"]:checked')?.value||'count';const inicio=document.getElementById('nt-inicio')?.value;const fin=document.getElementById('nt-fin')?.value;const rule={type:recType,startDate:inicio||todayISO(),endType:recEndType};if(recType==='interval'){rule.interval=parseInt(document.getElementById('rec-interval')?.value)||1;rule.unit=document.getElementById('rec-unit')?.value||'week';}else{rule.weekday=parseInt(document.getElementById('rec-weekday')?.value)||1;rule.weeknum=parseInt(document.getElementById('rec-weeknum')?.value)||1;}if(recEndType==='count'){rule.count=Math.min(parseInt(document.getElementById('rec-count')?.value)||5,52);}else{rule.endDate=document.getElementById('rec-end-date')?.value||'';}if(inicio&&fin){const d1=new Date(inicio+'T12:00:00'),d2=new Date(fin+'T12:00:00');rule.duration=Math.max(0,Math.round((d2-d1)/86400000));}else{rule.duration=0;}return rule;}
function generateOccurrences(rule){const MAX=52;const occs=[];let cur;if(rule.type==='monthly_day'){const sd=new Date(rule.startDate+'T12:00:00');cur=getNthWeekdayOfMonth(sd.getFullYear(),sd.getMonth(),rule.weekday,rule.weeknum);if(cur<sd){const nm=new Date(cur.getTime());nm.setMonth(nm.getMonth()+1);cur=getNthWeekdayOfMonth(nm.getFullYear(),nm.getMonth(),rule.weekday,rule.weeknum);}}else{cur=new Date(rule.startDate+'T12:00:00');}const endDate=(rule.endType==='date'&&rule.endDate)?new Date(rule.endDate+'T23:59:59'):null;const maxCount=rule.endType==='count'?Math.min(rule.count,MAX):MAX;for(let i=0;i<maxCount&&occs.length<MAX;i++){if(endDate&&cur>endDate)break;const inicio=toISO(cur);const fin=rule.duration>0?toISO(new Date(cur.getTime()+rule.duration*86400000)):inicio;occs.push({inicio,fin});if(rule.type==='interval'){if(rule.unit==='day')cur.setDate(cur.getDate()+rule.interval);else if(rule.unit==='week')cur.setDate(cur.getDate()+rule.interval*7);else cur.setMonth(cur.getMonth()+rule.interval);}else{const nm=new Date(cur.getTime());nm.setMonth(nm.getMonth()+1);nm.setDate(1);cur=getNthWeekdayOfMonth(nm.getFullYear(),nm.getMonth(),rule.weekday,rule.weeknum);}}return occs;}

function openNewTask(){
  const co=CLIENT_ORDER();

async function saveNewTask(){
  const nombre=document.getElementById('nt-nombre').value.trim();
  const cliente=document.getElementById('nt-cliente').value;
  if(!nombre||!cliente){toast('Falta nombre o cliente','#ef4444');return;}
  const isPeriodic=document.getElementById('nt-periodic').checked;
  const btn=document.getElementById('btn-save');btn.disabled=true;btn.textContent=isPeriodic?'Creando serie...':'Guardando...';
  const responsable=document.getElementById('nt-resp').value;
  const inicio=document.getElementById('nt-inicio').value||null;
  const fin=document.getElementById('nt-fin').value||null;
  const userNotes=document.getElementById('nt-sub').value||'';
  const prioridad=document.getElementById('nt-prio').value||'';
  try{
    if(!isPeriodic){
      const body={nombre,cliente,responsable,inicio,fin,sub:userNotes,prioridad};
      const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error(await r.text());
      const d=await r.json();
      allTasks.push({id:d.id,nombre,cliente,estado:'Pendiente',inicio,fin,responsable,sub:userNotes,prioridad});
      closeNewTask();render();toast('Tarea creada ✅','#10b981');
    }else{
      const rule=buildRule();const occs=generateOccurrences(rule);
      if(!occs.length){toast('No se generaron ocurrencias','#ef4444');return;}
      if(rule.endType==='date'&&!rule.endDate){toast('Ingresá una fecha de fin para la serie','#ef4444');return;}
      const sid=makeSID();const subWithSID='[SID:'+sid+']'+(userNotes?' '+userNotes:'');
      const instances=occs.map(occ=>({nombre,cliente,responsable,estado:'Pendiente',inicio:occ.inicio,fin:occ.fin,sub:subWithSID,prioridad}));
      const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instances})});
      if(!r.ok)throw new Error(await r.text());
      const d=await r.json();
      d.ids.forEach((id,i)=>{allTasks.push({id,nombre,cliente,estado:'Pendiente',inicio:occs[i].inicio,fin:occs[i].fin,responsable,sub:subWithSID,prioridad});});
      allTasks.sort((a,b)=>{if(!a.fin)return 1;if(!b.fin)return -1;return a.fin.localeCompare(b.fin);});
      closeNewTask();render();toast(occs.length+' tareas periódicas creadas ✅','#10b981');
    }
  }catch(e){toast('Error: '+e.message,'#ef4444');}
  finally{btn.disabled=false;btn.textContent='Guardar en Notion';}
}

function openAddCompany(){document.getElementById('company-name').value='';document.getElementById('modal-company').classList.add('open');setTimeout(()=>document.getElementById('company-name').focus(),80);}

function saveNewCompany(){
  const name=document.getElementById('company-name').value.trim();
  if(!name){toast('Ingresá un nombre','#ef4444');return;}
  if([...DEFAULT_CLIENTS,...customClients].includes(name)){toast('Esa empresa ya existe','#ef4444');return;}
  customClients.push(name);try{localStorage.setItem('raices_custom_clients',JSON.stringify(customClients));}catch(e){}
  const addBtn=document.getElementById('btn-add-company');
  const btn=document.createElement('button');btn.className='fbtn';btn.dataset.f=name;btn.textContent='📁 '+name;btn.onclick=()=>setFilter(name);
  addBtn.parentElement.insertBefore(btn,addBtn);
  if(!CLIENT_COLORS[name])CLIENT_COLORS[name]='#94a3b8';
  closeAddCompany();toast(name+' agregada ✅','#10b981');
}

async function syncSheet(){
  const btn=document.getElementById('btn-sync');btn.disabled=true;btn.textContent='Sincronizando...';
  try{
    const r=await fetch('/api/sheet',{method:'POST'});if(!r.ok)throw new Error(await r.text());
    const d=await r.json();
    if(d.synced>0){toast(d.synced+' tarea'+(d.synced>1?'s':'')+' importada'+(d.synced>1?'s':'')+' ✅','#10b981');await loadTasks();}
    else toast('Todo al día, nada nuevo','#6366f1');
  }catch(e){toast('Error sync: '+e.message,'#ef4444');}
  finally{btn.disabled=false;btn.textContent='↻ Sync';}
}

{"org":"Surcala","pilar":"Empresa","mes":1,"anio":2027,"raices":2100000,"mio":690000,"ok":false,"comentario":""},
{"org":"Zubillaga","pilar":"Empresa","mes":1,"anio":2027,"raices":1800000,"mio":810000,"ok":false,"comentario":""}
];

// ═══ FACTURACIÓN ═══
let factCharts = {};

function renderFact(el) {
  // Destroy old charts
  Object.values(factCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  factCharts = {};

  const MESES_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  // Build month map
  const monthMap = {};
  PAGOS_DATA.forEach(r => {
    const key = `${r.anio}-${String(r.mes).padStart(2,'0')}`;
    if (!monthMap[key]) monthMap[key] = {raices_ok:0,mio_ok:0,raices_nok:0,mio_nok:0};
    if (r.ok) { monthMap[key].raices_ok += r.raices; monthMap[key].mio_ok += r.mio; }
    else      { monthMap[key].raices_nok += r.raices; monthMap[key].mio_nok += r.mio; }
  });
  const monthKeys = Object.keys(monthMap).sort();

  // KPIs
  const totalRaicesOk  = PAGOS_DATA.filter(r=>r.ok).reduce((s,r)=>s+r.raices,0);
  const totalMioOk     = PAGOS_DATA.filter(r=>r.ok).reduce((s,r)=>s+r.mio,0);
  const totalPendiente = PAGOS_DATA.filter(r=>!r.ok).reduce((s,r)=>s+r.raices,0);
  const totalMioPend   = PAGOS_DATA.filter(r=>!r.ok).reduce((s,r)=>s+r.mio,0);

  // MRR: avg last 3 months cobrado
  const todayKey = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
  const pastKeys = monthKeys.filter(k=>k<=todayKey && monthMap[k].raices_ok>0);
  const last3    = pastKeys.slice(-3);
  const mrr      = last3.length ? Math.round(last3.reduce((s,k)=>s+monthMap[k].raices_ok,0)/last3.length) : 0;

  // 2025 vs 2026 YoY
  const tot2025 = PAGOS_DATA.filter(r=>r.ok&&r.anio===2025).reduce((s,r)=>s+r.raices,0);
  const tot2026 = PAGOS_DATA.filter(r=>r.ok&&r.anio===2026).reduce((s,r)=>s+r.raices,0);
  const yoy = tot2025>0 ? Math.round((tot2026-tot2025)/tot2025*100) : 0;

  // Client aggregates
  const clients = {};
  PAGOS_DATA.forEach(r => {
    if (!clients[r.org]) clients[r.org]={org:r.org,pilar:r.pilar,total:0,cobrado:0,pendiente:0,mio_total:0,lastOkKey:''};
    clients[r.org].total    += r.raices;
    clients[r.org].mio_total+= r.mio;
    if (r.ok) {
      clients[r.org].cobrado += r.raices;
      const k=`${r.anio}-${String(r.mes).padStart(2,'0')}`;
      if (k>clients[r.org].lastOkKey) clients[r.org].lastOkKey=k;
    } else { clients[r.org].pendiente += r.raices; }
  });
  const clientList = Object.values(clients).sort((a,b)=>b.total-a.total);

  // Concentration top 3
  const top3sum = clientList.slice(0,3).reduce((s,c)=>s+c.cobrado,0);
  const conc = totalRaicesOk>0 ? Math.round(top3sum/totalRaicesOk*100) : 0;

  // IPC alerts
  const ipcAlerts = [...new Set(PAGOS_DATA.filter(r=>r.comentario.toLowerCase().includes('ipc')).map(r=>r.org))];

  const fmt = n => n>=1000000 ? `$${(n/1000000).toFixed(1)}M` : `$${Math.round(n/1000)}K`;
  const fmtKey = k => { if(!k)return '—'; const [y,m]=k.split('-'); return MESES_SHORT[parseInt(m)-1]+' '+y; };

  // Estado per client
  const stateOf = c => {
    if (c.pendiente>0) return {label:'Proyectado',cls:'fact-pill-pend'};
    if (c.lastOkKey>=last3[0]||!last3[0]) return {label:'Activo',cls:'fact-pill-ok'};
    return {label:'Inactivo',cls:'fact-pill-inact'};
  };

  el.innerHTML = `
<div class="wrap" style="max-width:1000px">

  <!-- KPI -->
  <div class="fact-kpi-grid">
    <div class="fact-kpi"><div class="fact-kpi-num" style="color:#10b981">${fmt(totalRaicesOk)}</div><div class="fact-kpi-label">Total cobrado (RAICES)</div></div>
    <div class="fact-kpi"><div class="fact-kpi-num" style="color:#3b82f6">${fmt(totalMioOk)}</div><div class="fact-kpi-label">Tu parte cobrada (MIO)</div></div>
    <div class="fact-kpi"><div class="fact-kpi-num" style="color:#f59e0b">${fmt(totalPendiente)}</div><div class="fact-kpi-label">Proyectado pendiente</div></div>
    <div class="fact-kpi"><div class="fact-kpi-num" style="color:#a78bfa">${fmt(mrr)}</div><div class="fact-kpi-label">MRR últimos 3 meses</div></div>
  </div>

  <!-- Chart mensual -->
  <div class="chart-box" style="margin-bottom:14px">
    <div class="chart-box-title">Evolución mensual — RAICES cobrado · proyectado · Nacho</div>
    <div style="position:relative;height:240px"><canvas id="fact-monthly"></canvas></div>
  </div>

  <!-- Grid charts -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
    <div class="chart-box">
      <div class="chart-box-title">Distribución — Nacho vs Resto (cobrado)</div>
      <div style="position:relative;height:180px"><canvas id="fact-split"></canvas></div>
    </div>
    <div class="chart-box">
      <div class="chart-box-title">Indicadores financieros</div>
      <div class="mini-row"><span style="color:#94a3b8">Crecimiento 2025→2026</span><span style="color:${yoy>=0?'#10b981':'#f87171'};font-weight:700">${yoy>=0?'+':''}${yoy}%</span></div>
      <div class="mini-row"><span style="color:#94a3b8">Concentración top 3 clientes</span><span style="color:${conc>70?'#f87171':conc>50?'#f59e0b':'#10b981'};font-weight:700">${conc}%</span></div>
      <div class="mini-row"><span style="color:#94a3b8">Tu % sobre lo cobrado</span><span style="color:#3b82f6;font-weight:700">${totalRaicesOk>0?Math.round(totalMioOk/totalRaicesOk*100):0}%</span></div>
      <div class="mini-row"><span style="color:#94a3b8">Proyectado MIO (resto 2026)</span><span style="color:#a78bfa;font-weight:700">${fmt(totalMioPend)}</span></div>
      <div class="mini-row"><span style="color:#94a3b8">2025 total RAICES</span><span style="color:#64748b;font-weight:700">${fmt(tot2025)}</span></div>
      <div class="mini-row"><span style="color:#94a3b8">2026 total cobrado</span><span style="color:#64748b;font-weight:700">${fmt(tot2026)}</span></div>
    </div>
  </div>

  <!-- Tabla clientes -->
  <div class="fact-table">
    <div class="fact-th"><span>Cliente</span><span>Pilar</span><span style="text-align:right">Total</span><span style="text-align:right">Cobrado</span><span style="text-align:right">Pendiente</span><span style="text-align:right">Último pago</span><span style="text-align:center">Estado</span></div>
    ${clientList.filter(c=>c.total>0).map(c=>{
      const s=stateOf(c);
      return `<div class="fact-tr">
        <span class="fact-name" title="${esc(c.org)}">${esc(c.org)}</span>
        <span class="fact-tc">${esc(c.pilar)}</span>
        <span class="fact-tc">${fmt(c.total)}</span>
        <span class="fact-tc" style="color:#10b981">${c.cobrado>0?fmt(c.cobrado):'—'}</span>
        <span class="fact-tc" style="color:${c.pendiente>0?'#f59e0b':'#334155'}">${c.pendiente>0?fmt(c.pendiente):'—'}</span>
        <span class="fact-tc">${fmtKey(c.lastOkKey)}</span>
        <span style="text-align:center"><span class="fact-pill ${s.cls}">${s.label}</span></span>
      </div>`;
    }).join('')}
  </div>

  <!-- Ideas / Insights -->
  <div class="fact-insight">
    <div class="fact-insight-title">💡 Insights y oportunidades</div>
    ${ipcAlerts.length ? `<div class="fact-insight-row"><div class="fact-insight-icon">📌</div><div class="fact-insight-text"><strong>Pendiente de ajuste IPC:</strong> ${ipcAlerts.map(o=>esc(o)).join(', ')} — tienen comentarios de ajuste pendiente en el Excel.</div></div>` : ''}
    <div class="fact-insight-row"><div class="fact-insight-icon">⚠️</div><div class="fact-insight-text"><strong>Concentración de ingresos:</strong> el top 3 representa el ${conc}% de lo cobrado. ${conc>65?'Riesgo alto — diversificar cartera.':conc>50?'Riesgo moderado.':'Cartera bien distribuida.'}</div></div>
    <div class="fact-insight-row"><div class="fact-insight-icon">📈</div><div class="fact-insight-text"><strong>Crecimiento 2026:</strong> ${yoy>=0?`+${yoy}% vs 2025. Tendencia positiva.`:`${yoy}% vs 2025. Revisar cartera.`} Considerar proyección anual extrapolando MRR actual.</div></div>
    <div class="fact-insight-row"><div class="fact-insight-icon">💡</div><div class="fact-insight-text"><strong>Separación Vicky/Gastos:</strong> hoy el "Resto" (RAICES - MIO) mezcla parte de Vicky con gastos operativos. Separar en el Excel con columnas "VICKY" y "GASTOS" permitiría ver la distribución real y la rentabilidad neta.</div></div>
    <div class="fact-insight-row"><div class="fact-insight-icon">🔮</div><div class="fact-insight-text"><strong>Registro de gastos:</strong> sin datos de egresos no se puede calcular margen neto. Incluso una hoja simple (herramientas, viáticos, inversiones) desbloquearía el P&L mensual.</div></div>
    <div class="fact-insight-row"><div class="fact-insight-icon">📅</div><div class="fact-insight-text"><strong>Clientes inactivos:</strong> ${clientList.filter(c=>stateOf(c).label==='Inactivo').map(c=>esc(c.org)).join(', ')||'ninguno detectado'} — sin pagos recientes ni proyecciones. ¿Oportunidad de retomar?</div></div>
  </div>

</div>`;

  // Chart: evolución mensual
  setTimeout(() => {
    const labels = monthKeys.map(k => { const [y,m]=k.split('-'); return MESES_SHORT[parseInt(m)-1]+' '+y.slice(2); });
    const raicesOkData  = monthKeys.map(k => monthMap[k].raices_ok  || 0);
    const raicesNokData = monthKeys.map(k => monthMap[k].raices_nok || 0);
    const mioOkData     = monthKeys.map(k => monthMap[k].mio_ok     || null);
    const mioNokData    = monthKeys.map(k => monthMap[k].mio_nok>0  ? monthMap[k].mio_nok : null);

    const ctxM = document.getElementById('fact-monthly');
    if (ctxM) {
      factCharts.monthly = new Chart(ctxM, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'RAICES cobrado', data: raicesOkData, backgroundColor: '#3b82f650', borderColor: '#3b82f6', borderWidth: 1, stack: 'raices' },
            { label: 'RAICES proyectado', data: raicesNokData, backgroundColor: '#f59e0b30', borderColor: '#f59e0b60', borderWidth: 1, borderDash: [4,4], stack: 'raices' },
            { label: 'Nacho cobrado', data: mioOkData, type: 'line', borderColor: '#10b981', backgroundColor: 'transparent', tension: 0.3, pointRadius: 2, borderWidth: 2, spanGaps: false },
            { label: 'Nacho proyectado', data: mioNokData, type: 'line', borderColor: '#10b98170', backgroundColor: 'transparent', tension: 0.3, pointRadius: 2, borderWidth: 2, borderDash: [5,5], spanGaps: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#64748b', font: { size: 11 } } } },
          scales: {
            x: { stacked: true, ticks: { color: '#475569', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#1e293b' } },
            y: { stacked: false, ticks: { color: '#475569', font: { size: 10 }, callback: v => v>=1000000?'$'+(v/1000000).toFixed(1)+'M':'$'+(v/1000)+'K' }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    // Chart: split donut
    const restoOk = totalRaicesOk - totalMioOk;
    const ctxS = document.getElementById('fact-split');
    if (ctxS) {
      factCharts.split = new Chart(ctxS, {
        type: 'doughnut',
        data: {
          labels: ['Nacho (MIO)', 'Vicky + gastos'],
          datasets: [{ data: [totalMioOk, restoOk], backgroundColor: ['#3b82f6','#f59e0b'], borderColor: '#1e293b', borderWidth: 3 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#64748b', font: { size: 11 }, padding: 12 } },
            tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw)} (${Math.round(ctx.raw/(totalRaicesOk)*100)}%)` } }
          }
        }
      });
    }
  }, 50);
}
</script>
</body>
</html>
